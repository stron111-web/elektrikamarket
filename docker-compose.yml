services:
  postgres:
    image: postgres:17
    container_name: elektrika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elektrika
      POSTGRES_PASSWORD: elektrika_dev_password
      POSTGRES_DB: elektrikamarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: