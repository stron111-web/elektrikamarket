name: Validate PVZ cluster correction (no deployment)
on:
  push:
    branches: [codex/pvz-clusters-safe]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Test viewport and cluster data
        run: |
          node --test web/tests/pvz-bounds.test.cjs web/tests/pvz-clusters.test.cjs
          node --test web/tests/dadata-security.test.cjs deploy/preview/dadata/loader.test.cjs
      - name: Check TypeScript
        run: npm --prefix web run typecheck
      - name: Build storefront without deploy credentials
        run: npm --prefix web run build
