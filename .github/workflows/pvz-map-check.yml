name: Isolated CDEK map check (no deployment)
on:
  push:
    branches: [codex/pvz-nearby-safe-retry]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install locked frontend dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Test Yandex viewport coordinates
        run: node --test web/tests/pvz-bounds.test.cjs
      - name: Verify frontend types
        run: npm --prefix web run typecheck
      - name: Production build without secrets or deploy credentials
        run: npm --prefix web run build
